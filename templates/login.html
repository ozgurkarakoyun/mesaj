<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>PIN Girişi — PrivateMsg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100dvh;background:#061612;color:#fff;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(37,211,102,.20),transparent 34%),radial-gradient(circle at 0 100%,rgba(18,140,126,.22),transparent 38%),linear-gradient(180deg,#061612,#020806);pointer-events:none}.card{position:relative;z-index:2;width:min(390px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px 22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.lock{width:62px;height:62px;border-radius:20px;background:rgba(37,211,102,.16);display:grid;place-items:center;font-size:30px;margin:0 auto 16px}.title{text-align:center;font-size:25px;font-weight:800;letter-spacing:-.5px}.sub{text-align:center;color:rgba(255,255,255,.68);font-size:13px;margin-top:7px;margin-bottom:22px}.dots{display:flex;justify-content:center;gap:14px;margin:12px 0 22px}.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.34);background:transparent}.dot.on{background:#25d366;border-color:#25d366;box-shadow:0 0 18px rgba(37,211,102,.7)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;user-select:none}.key{height:64px;border:0;border-radius:22px;background:rgba(255,255,255,.10);color:#fff;font-size:25px;font-weight:700;cursor:pointer;transition:.12s}.key:active{transform:scale(.96);background:rgba(37,211,102,.22)}.key.alt{font-size:15px;font-weight:700;color:rgba(255,255,255,.78)}.hidden-input{position:absolute;opacity:0;pointer-events:none}.error{margin-top:18px;background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.5);color:#ffb3b3;padding:11px 13px;border-radius:14px;font-size:13px;text-align:center}.hint{text-align:center;color:rgba(255,255,255,.55);font-size:12px;margin-top:16px;line-height:1.4}@media(max-width:380px){.card{padding:24px 16px}.key{height:58px;border-radius:18px}.title{font-size:23px}}
</style>
</head>
<body>
<div class="bg"></div>
<form class="card" method="POST" action="/login" id="pinForm" autocomplete="off">
  <div class="lock">🔐</div>
  <div class="title">PrivateMsg</div>
  <div class="sub">4 haneli PIN ile giriş yapın</div>
  <input class="hidden-input" id="codeInput" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" autofocus required>
  <div class="dots" aria-label="PIN göstergesi">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
  <div class="pad">
    <button type="button" class="key" onclick="pressKey('1')">1</button>
    <button type="button" class="key" onclick="pressKey('2')">2</button>
    <button type="button" class="key" onclick="pressKey('3')">3</button>
    <button type="button" class="key" onclick="pressKey('4')">4</button>
    <button type="button" class="key" onclick="pressKey('5')">5</button>
    <button type="button" class="key" onclick="pressKey('6')">6</button>
    <button type="button" class="key" onclick="pressKey('7')">7</button>
    <button type="button" class="key" onclick="pressKey('8')">8</button>
    <button type="button" class="key" onclick="pressKey('9')">9</button>
    <button type="button" class="key alt" onclick="clearPin()">Temizle</button>
    <button type="button" class="key" onclick="pressKey('0')">0</button>
    <button type="button" class="key alt" onclick="backspacePin()">Sil</button>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="hint">PIN 4 haneye ulaşınca otomatik giriş denenir.</div>
</form>
<script>
const input=document.getElementById('codeInput');
function updateDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('on',i<input.value.length)}
function pressKey(n){if(input.value.length>=4)return;input.value+=n;updateDots();if(input.value.length===4)setTimeout(()=>document.getElementById('pinForm').submit(),120)}
function backspacePin(){input.value=input.value.slice(0,-1);updateDots()}
function clearPin(){input.value='';updateDots()}
input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,4);updateDots();if(input.value.length===4)document.getElementById('pinForm').submit()});
window.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))pressKey(e.key);if(e.key==='Backspace')backspacePin();if(e.key==='Escape')clearPin()});
setTimeout(()=>input.focus(),200);
</script>
</body>
</html>
