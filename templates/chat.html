<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PrivateMsg</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--wa-dark:#075e54;--wa:#128c7e;--wa-light:#25d366;--chat-bg:#e5ddd5;--own:#dcf8c6;--other:#fff;--text:#111b21;--muted:#667781;--border:#d1d7db;--blue:#34b7f1;--danger:#ef5350} body{height:100dvh;font-family:Arial,Helvetica,sans-serif;background:var(--chat-bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}.header{height:58px;background:var(--wa-dark);color:#fff;display:flex;align-items:center;padding:8px 12px;gap:10px;flex-shrink:0}.avatar{width:40px;height:40px;border-radius:50%;background:#dfe5e7;color:var(--wa-dark);display:flex;align-items:center;justify-content:center;font-weight:700}.title-wrap{flex:1;min-width:0}.title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;gap:4px}.icon-btn{width:38px;height:38px;border:0;background:transparent;color:#fff;border-radius:50%;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}.icon-btn:hover{background:rgba(255,255,255,.12)}.messages-container{flex:1;overflow-y:auto;padding:14px 10px 10px;background:var(--chat-bg);background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column;gap:3px}.day-divider{align-self:center;background:rgba(255,255,255,.85);color:var(--muted);font-size:12px;border-radius:8px;padding:6px 12px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08)}.msg-wrap{display:flex;flex-direction:column;max-width:78%;margin:2px 0}.msg-wrap.own{align-self:flex-end;align-items:flex-end}.msg-wrap.other{align-self:flex-start;align-items:flex-start}.msg-bubble{position:relative;padding:7px 8px 5px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:15px;line-height:1.35;word-break:break-word}.own .msg-bubble{background:var(--own);border-top-right-radius:2px}.other .msg-bubble{background:var(--other);border-top-left-radius:2px}.msg-name{font-size:11px;color:var(--wa);font-weight:600;margin-bottom:3px}.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;color:var(--muted);font-size:11px;min-width:48px}.ticks{font-size:14px;line-height:1;color:#8696a0}.ticks.read{color:var(--blue)}.msg-image{display:block;max-width:min(280px,70vw);max-height:330px;border-radius:8px;object-fit:cover;cursor:pointer}.msg-file{display:flex;align-items:center;gap:10px;min-width:210px;max-width:280px;background:rgba(255,255,255,.55);border-radius:8px;padding:10px;color:var(--text);text-decoration:none}.file-icon{font-size:24px}.typing-indicator{height:22px;padding:3px 14px;font-size:12px;color:var(--muted);background:var(--chat-bg);flex-shrink:0}.composer{display:flex;align-items:flex-end;gap:7px;padding:8px;background:#f0f2f5;flex-shrink:0}.composer-box{flex:1;background:#fff;border-radius:24px;display:flex;align-items:flex-end;padding:4px 6px 4px 12px;gap:2px}.composer textarea{flex:1;border:0;outline:0;resize:none;max-height:100px;padding:9px 4px;font-size:15px;font-family:Arial,Helvetica,sans-serif}.composer-btn{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:50%;font-size:20px;cursor:pointer}.send-btn{width:44px;height:44px;border:0;border-radius:50%;background:var(--wa);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}.preview{display:none;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}.preview.active{display:flex}.preview img{width:58px;height:58px;object-fit:cover;border-radius:8px}.preview-info{flex:1;min-width:0}.preview-title{font-size:13px;font-weight:600}.preview-name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-action{border:0;border-radius:18px;padding:9px 13px;cursor:pointer}.preview-action.send{background:var(--wa);color:#fff}.preview-action.cancel{background:#f1f1f1;color:var(--danger)}.camera-modal,.call-overlay,.incoming-overlay,.lightbox{display:none;position:fixed;inset:0;z-index:1000}.camera-modal.active,.call-overlay.active,.lightbox.active{display:flex}.camera-modal{background:#111;flex-direction:column}.camera-top{height:56px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#000}.camera-body{flex:1;display:flex;align-items:center;justify-content:center;background:#000}.camera-body video,.camera-body canvas{max-width:100%;max-height:100%;object-fit:contain}.camera-actions{height:92px;background:#000;display:flex;align-items:center;justify-content:center;gap:36px}.capture-btn{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ddd;cursor:pointer}.camera-small{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:24px;padding:12px 16px;cursor:pointer}.call-overlay{background:#111;z-index:1100;flex-direction:column;color:#fff}.call-header{height:72px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));display:flex;align-items:center;padding:14px;gap:12px;z-index:2}.call-avatar{width:42px;height:42px;border-radius:50%;background:#dfe5e7;color:var(--wa-dark);display:flex;align-items:center;justify-content:center;font-weight:700}.call-info{flex:1}.call-name{font-weight:600}.call-status{font-size:13px;opacity:.85}.video-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#111}.video-stage.active{background:#000}#remoteVideo{width:100%;height:100%;object-fit:cover;background:#111}#localVideo{position:absolute;right:14px;top:14px;width:118px;height:170px;border-radius:12px;object-fit:cover;background:#222;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 12px rgba(0,0,0,.4)}.call-controls{height:96px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0));display:flex;align-items:center;justify-content:center;gap:20px}.call-btn{width:58px;height:58px;border-radius:50%;border:0;font-size:22px;color:#fff;background:rgba(255,255,255,.18);cursor:pointer}.call-btn.end{background:#e53935}.incoming-overlay.active{display:flex}.incoming-overlay{z-index:1050;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.25);padding:18px}.incoming-card{width:min(380px,100%);background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}.incoming-name{font-size:20px;font-weight:700;margin:6px 0}.incoming-type{color:var(--muted);font-size:14px;margin-bottom:16px}.incoming-btns{display:flex;justify-content:center;gap:26px}.lightbox{background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:1300}.lightbox img{max-width:94vw;max-height:94vh;border-radius:6px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.78);color:#fff;padding:10px 14px;border-radius:18px;font-size:13px;z-index:1400;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="header"><div class="avatar" id="avatar">PM</div><div class="title-wrap"><div class="title" id="chatTitle">PrivateMsg</div><div class="status" id="status-text">Bağlanıyor...</div></div><div class="header-actions"><button class="icon-btn" onclick="startCall('audio')" title="Sesli arama">☎️</button><button class="icon-btn" onclick="startCall('video')" title="Görüntülü arama">📹</button><button class="icon-btn" onclick="location.href='/logout'" title="Çıkış">⋮</button></div></div>
<div class="messages-container" id="messages"><div class="day-divider">Bugün</div></div><div class="typing-indicator" id="typingIndicator"></div>
<div class="preview" id="photoPreview"><img id="photoPreviewImg" src="" alt="Önizleme"><div class="preview-info"><div class="preview-title">Fotoğraf hazır</div><div class="preview-name" id="photoPreviewName"></div></div><button class="preview-action cancel" onclick="clearSelectedPhoto()">İptal</button><button class="preview-action send" onclick="sendSelectedPhoto()">Gönder</button></div>
<div class="composer"><div class="composer-box"><textarea id="msg-input" rows="1" maxlength="4000" placeholder="Mesaj"></textarea><button class="composer-btn" onclick="openCameraModal()" title="Kamera">📷</button><button class="composer-btn" onclick="document.getElementById('photoInput').click()" title="Galeriden fotoğraf">🖼️</button><button class="composer-btn" onclick="document.getElementById('fileInput').click()" title="Dosya">📎</button></div><button class="send-btn" onclick="sendMessage()">➤</button></div>
<input type="file" id="photoInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="handlePhotoSelect(this)"><input type="file" id="fileInput" accept="application/pdf,video/mp4" style="display:none" onchange="handleFileUpload(this)">
<div class="camera-modal" id="cameraModal"><div class="camera-top"><button class="camera-small" onclick="closeCameraModal()">Kapat</button><div>Kamera</div><button class="camera-small" onclick="flipCamera()">Çevir</button></div><div class="camera-body"><video id="cameraVideo" autoplay playsinline muted></video><canvas id="cameraCanvas" style="display:none"></canvas></div><div class="camera-actions"><button class="camera-small" onclick="closeCameraModal()">İptal</button><button class="capture-btn" onclick="capturePhoto()"></button><button class="camera-small" onclick="sendCapturedPhoto()" id="sendCaptureBtn" style="display:none">Gönder</button></div></div>
<div class="incoming-overlay" id="incomingOverlay"><div class="incoming-card"><div>Gelen arama</div><div class="incoming-name" id="incomingName"></div><div class="incoming-type" id="incomingType"></div><div class="incoming-btns"><button class="call-btn end" onclick="rejectCall()">📵</button><button class="call-btn" style="background:var(--wa-light)" onclick="acceptCall()">📞</button></div></div></div>
<div class="call-overlay" id="callOverlay"><div class="call-header"><div class="call-avatar">PM</div><div class="call-info"><div class="call-name" id="callUserName"></div><div class="call-status" id="callStatus">Bağlanıyor...</div></div></div><div class="video-stage" id="videoStage"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div><div class="call-controls"><button class="call-btn" id="muteBtn" onclick="toggleMute()">🎙️</button><button class="call-btn" id="videoBtn" onclick="toggleVideo()">📹</button><button class="call-btn end" onclick="endCall()">📵</button></div></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div><div class="toast" id="toast"></div>
<script>
const ME={{user|tojson}};const socket=io();let typingTimer,isTyping=false,peerConnection=null,localStream=null,callType=null,incomingCallData=null,isMuted=false,isVideoOff=false,otherOnline=false,callActive=false,sentEndSignal=false,selectedPhotoFile=null,selectedPhotoObjectUrl=null,cameraStream=null,cameraFacing='environment',capturedBlob=null;
const messagesEl=document.getElementById('messages');
socket.on('connect',()=>{socket.emit('join',{});loadHistory();});socket.on('connect_error',()=>showToast('Bağlantı hatası'));socket.on('disconnect',()=>showToast('Bağlantı koptu'));
async function loadHistory(){try{const res=await fetch('/api/messages');if(!res.ok)return;const msgs=await res.json();messagesEl.innerHTML='';let lastDate='';msgs.forEach(m=>{appendDateDividerIfNeeded(m.date_label,lastDate);if(m.date_label)lastDate=m.date_label;appendMessage(m);});scrollToBottom();markVisibleMessagesRead();}catch(e){console.error(e)}}
function appendDateDividerIfNeeded(d,last){if(!d||d===last)return;const div=document.createElement('div');div.className='day-divider';div.textContent=isTodayLabel(d)?'Bugün':d;messagesEl.appendChild(div)}function isTodayLabel(d){return d===new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})}
socket.on('user_status',data=>{const list=Array.isArray(data.online)?data.online:[];const others=list.filter(u=>u.id!==ME.id);otherOnline=others.length>0;document.getElementById('chatTitle').textContent=otherOnline?others[0].name:'PrivateMsg';document.getElementById('avatar').textContent=otherOnline?initials(others[0].name):'PM';document.getElementById('status-text').textContent=otherOnline?'çevrimiçi':'karşı taraf çevrimdışı'});
socket.on('message',msg=>{appendDateDividerIfNeeded(msg.date_label,'');appendMessage(msg);scrollToBottom();markVisibleMessagesRead();});socket.on('messages_read',data=>{(data.ids||[]).forEach(id=>setMessageRead(id));});socket.on('typing',data=>{const el=document.getElementById('typingIndicator');el.textContent=data.typing&&data.user?`${data.user.name} yazıyor...`:''});
function appendMessage(msg){if(!msg||!msg.user)return;const own=msg.user.id===ME.id;const wrap=document.createElement('div');wrap.className='msg-wrap '+(own?'own':'other');wrap.dataset.id=msg.id;wrap.dataset.sender=msg.user.id;let body='';const safeUrl=sanitizeRelativeUrl(msg.file_url||'');if(msg.type==='image'&&safeUrl){body=`<img class="msg-image" src="${safeUrl}" onclick="openLightbox('${safeUrl}')" loading="lazy" alt="Fotoğraf">`;}else if(msg.type==='file'&&safeUrl){body=`<a class="msg-file" href="${safeUrl}" target="_blank" rel="noopener" download><span class="file-icon">📄</span><span>${escapeHtml(msg.file_name||'Dosya')}</span></a>`;}else{body=`<div>${escapeHtml(msg.text||'').replace(/\n/g,'<br>')}</div>`;}wrap.innerHTML=`<div class="msg-name">${own?'':escapeHtml(msg.user.name||'')}</div><div class="msg-bubble">${body}<div class="msg-meta"><span>${escapeHtml(msg.timestamp||'')}</span>${own?`<span class="ticks ${msg.read?'read':''}" data-tick-for="${msg.id}">✓✓</span>`:''}</div></div>`;messagesEl.appendChild(wrap)}
function setMessageRead(id){const t=document.querySelector(`[data-tick-for="${CSS.escape(id)}"]`);if(t)t.classList.add('read')}
function markVisibleMessagesRead(){const ids=[...document.querySelectorAll('.msg-wrap.other')].map(el=>el.dataset.id).filter(Boolean);if(ids.length)socket.emit('messages_read',{ids})}
messagesEl.addEventListener('scroll',()=>{clearTimeout(window.readTimer);window.readTimer=setTimeout(markVisibleMessagesRead,300)});window.addEventListener('focus',markVisibleMessagesRead);
function sendMessage(){const input=document.getElementById('msg-input');const text=input.value.trim();if(!text)return;socket.emit('message',{text,type:'text'});input.value='';input.style.height='auto';stopTyping()}
const msgInput=document.getElementById('msg-input');msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});msgInput.addEventListener('input',()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';if(!isTyping){isTyping=true;socket.emit('typing',{typing:true})}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,2000)});function stopTyping(){if(isTyping){isTyping=false;socket.emit('typing',{typing:false})}}
function handlePhotoSelect(input){const file=input.files[0];if(!file)return;preparePhotoPreview(file)}function preparePhotoPreview(file){const allowed=['image/png','image/jpeg','image/gif','image/webp'];if(!allowed.includes(file.type)){showToast('Sadece PNG, JPG, JPEG, GIF veya WEBP');return}selectedPhotoFile=file;if(selectedPhotoObjectUrl)URL.revokeObjectURL(selectedPhotoObjectUrl);selectedPhotoObjectUrl=URL.createObjectURL(file);document.getElementById('photoPreviewImg').src=selectedPhotoObjectUrl;document.getElementById('photoPreviewName').textContent=file.name;document.getElementById('photoPreview').classList.add('active')}
function clearSelectedPhoto(){selectedPhotoFile=null;if(selectedPhotoObjectUrl){URL.revokeObjectURL(selectedPhotoObjectUrl);selectedPhotoObjectUrl=null}document.getElementById('photoInput').value='';document.getElementById('photoPreview').classList.remove('active')}
async function sendSelectedPhoto(){if(!selectedPhotoFile)return;await uploadAndSendPhoto(selectedPhotoFile);clearSelectedPhoto()}
async function uploadAndSendPhoto(file){const fd=new FormData();fd.append('photo',file,file.name||'camera.jpg');showToast('Fotoğraf yükleniyor...');try{const res=await fetch('/upload/photo',{method:'POST',body:fd});const data=await res.json();if(res.ok&&data.url){socket.emit('message',{type:'image',file_url:data.url,file_name:data.name,text:''});showToast('Fotoğraf gönderildi ✓')}else showToast('Hata: '+(data.error||'Bilinmeyen'))}catch(e){showToast('Fotoğraf yükleme hatası')}}
async function handleFileUpload(input){const file=input.files[0];if(!file)return;if(!['application/pdf','video/mp4'].includes(file.type)){showToast('Sadece PDF veya MP4');input.value='';return}const fd=new FormData();fd.append('file',file);showToast('Dosya yükleniyor...');try{const res=await fetch('/upload',{method:'POST',body:fd});const data=await res.json();if(res.ok&&data.url){socket.emit('message',{type:'file',file_url:data.url,file_name:data.name,text:''});showToast('Dosya gönderildi ✓')}else showToast('Hata: '+(data.error||'Bilinmeyen'))}catch(e){showToast('Yükleme hatası')}input.value=''}
async function openCameraModal(){document.getElementById('cameraModal').classList.add('active');document.getElementById('cameraCanvas').style.display='none';document.getElementById('cameraVideo').style.display='block';document.getElementById('sendCaptureBtn').style.display='none';capturedBlob=null;await startCamera()}async function startCamera(){try{stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream}catch(e){showToast('Kamera açılamadı')}}function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}function closeCameraModal(){stopCamera();document.getElementById('cameraModal').classList.remove('active');capturedBlob=null}async function flipCamera(){cameraFacing=cameraFacing==='user'?'environment':'user';await startCamera()}function capturePhoto(){const video=document.getElementById('cameraVideo'),canvas=document.getElementById('cameraCanvas');if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.style.display='block';video.style.display='none';canvas.toBlob(blob=>{capturedBlob=blob;document.getElementById('sendCaptureBtn').style.display='inline-block'},'image/jpeg',0.92)}async function sendCapturedPhoto(){if(!capturedBlob)return;const file=new File([capturedBlob],`camera-${Date.now()}.jpg`,{type:'image/jpeg'});await uploadAndSendPhoto(file);closeCameraModal()}
const iceConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};async function startCall(type){if(!otherOnline){showToast('Karşı taraf çevrimdışı');return}if(callActive){showToast('Zaten aktif arama var');return}callType=type;callActive=true;sentEndSignal=false;socket.emit('call_request',{type});showCallOverlay(type,'Aranıyor...')}socket.on('call_request',data=>{if(callActive){socket.emit('call_response',{accepted:false,reason:'busy'});return}incomingCallData=data;document.getElementById('incomingName').textContent=data.from?.name||'Karşı taraf';document.getElementById('incomingType').textContent=data.type==='video'?'Görüntülü arama':'Sesli arama';document.getElementById('incomingOverlay').classList.add('active');ringbell()});async function acceptCall(){if(!incomingCallData)return;document.getElementById('incomingOverlay').classList.remove('active');callType=incomingCallData.type;callActive=true;sentEndSignal=false;try{await initLocalStream();showCallOverlay(callType,'Bağlanıyor...');peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);socket.emit('webrtc_offer',{sdp:offer});socket.emit('call_response',{accepted:true})}catch(e){showToast('Mikrofon/kamera izni alınamadı');socket.emit('call_response',{accepted:false});cleanupCall()}}function rejectCall(){document.getElementById('incomingOverlay').classList.remove('active');socket.emit('call_response',{accepted:false});incomingCallData=null}socket.on('call_response',async data=>{if(!data.accepted){cleanupCall();showToast(data.reason==='busy'?'Karşı taraf meşgul':'Arama reddedildi');return}try{await initLocalStream();peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream))}catch(e){showToast('Mikrofon/kamera izni alınamadı');endCall()}});socket.on('webrtc_offer',async data=>{try{if(!peerConnection){await initLocalStream();peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream))}await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);socket.emit('webrtc_answer',{sdp:answer});document.getElementById('callStatus').textContent='Bağlandı'}catch(e){showToast('Arama kurulamadı');endCall()}});socket.on('webrtc_answer',async data=>{try{if(peerConnection){await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));document.getElementById('callStatus').textContent='Bağlandı'}}catch(e){endCall()}});socket.on('webrtc_ice',async data=>{if(peerConnection&&data.candidate){try{await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))}catch(e){}}});socket.on('call_end',()=>{cleanupCall();showToast('Arama sonlandı')});
function createPC(){const pc=new RTCPeerConnection(iceConfig);pc.onicecandidate=e=>{if(e.candidate)socket.emit('webrtc_ice',{candidate:e.candidate})};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];document.getElementById('callStatus').textContent='Bağlandı'};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))document.getElementById('callStatus').textContent='Bağlantı koptu'};return pc}async function initLocalStream(){if(localStream)return;const c=callType==='video'?{audio:true,video:{facingMode:'user'}}:{audio:true,video:false};localStream=await navigator.mediaDevices.getUserMedia(c);document.getElementById('localVideo').srcObject=localStream;document.getElementById('videoStage').classList.toggle('active',callType==='video')}function showCallOverlay(type,status){document.getElementById('callOverlay').classList.add('active');document.getElementById('callUserName').textContent=document.getElementById('chatTitle').textContent;document.getElementById('callStatus').textContent=status;document.getElementById('videoStage').classList.toggle('active',type==='video');document.getElementById('videoBtn').style.display=type==='video'?'block':'none'}function endCall(){if(!sentEndSignal){sentEndSignal=true;socket.emit('call_end',{})}cleanupCall()}function cleanupCall(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(peerConnection){peerConnection.close();peerConnection=null}document.getElementById('callOverlay').classList.remove('active');document.getElementById('incomingOverlay').classList.remove('active');document.getElementById('remoteVideo').srcObject=null;document.getElementById('localVideo').srcObject=null;document.getElementById('muteBtn').textContent='🎙️';document.getElementById('videoBtn').textContent='📹';isMuted=false;isVideoOff=false;callActive=false;callType=null;incomingCallData=null}function toggleMute(){if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);document.getElementById('muteBtn').textContent=isMuted?'🔇':'🎙️'}function toggleVideo(){if(!localStream)return;isVideoOff=!isVideoOff;localStream.getVideoTracks().forEach(t=>t.enabled=!isVideoOff);document.getElementById('videoBtn').textContent=isVideoOff?'📵':'📹'}
function scrollToBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}function openLightbox(src){const u=sanitizeRelativeUrl(src);if(!u)return;document.getElementById('lightboxImg').src=u;document.getElementById('lightbox').classList.add('active')}function closeLightbox(){document.getElementById('lightbox').classList.remove('active')}function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function sanitizeRelativeUrl(u){u=String(u||'');return u.startsWith('/static/uploads/')?u.replace(/"/g,'%22').replace(/'/g,'%27'):''}function initials(n){return String(n||'PM').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function ringbell(){try{const ctx=new AudioContext(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(520,ctx.currentTime);o.frequency.setValueAtTime(440,ctx.currentTime+.15);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);o.start();o.stop(ctx.currentTime+.5)}catch(e){}}
