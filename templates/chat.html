<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--dark:#075e54;--main:#128c7e;--light:#25d366;--bg:#efe7de;--own:#dcf8c6;--other:#fff;--text:#111b21;--muted:#667781;--border:#d8dee2;--blue:#34b7f1;--danger:#e53935}body{height:100dvh;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:16px}.header{height:62px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:9px 12px;gap:10px;flex-shrink:0}.avatar{width:42px;height:42px;border-radius:50%;background:#dfe5e7;color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:700}.title-wrap{flex:1;min-width:0}.title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:13px;opacity:.9;margin-top:2px}.header-actions{display:flex;gap:3px}.icon-btn{width:40px;height:40px;border:0;background:transparent;color:#fff;border-radius:50%;font-size:20px;cursor:pointer}.icon-btn:hover{background:rgba(255,255,255,.12)}.messages-container{flex:1;overflow-y:auto;padding:14px 10px;background:var(--bg);background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column;gap:4px}.day-divider{align-self:center;background:rgba(255,255,255,.9);color:var(--muted);font-size:12px;border-radius:9px;padding:6px 12px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.08)}.msg-wrap{display:flex;flex-direction:column;max-width:82%;margin:2px 0}.msg-wrap.own{align-self:flex-end;align-items:flex-end}.msg-wrap.other{align-self:flex-start;align-items:flex-start}.msg-name{font-size:12px;color:var(--main);font-weight:700;margin:0 0 3px 2px}.msg-bubble{position:relative;padding:9px 10px 6px;border-radius:12px;box-shadow:0 1px .5px rgba(11,20,26,.16);font-size:16px;line-height:1.42;word-break:break-word}.own .msg-bubble{background:var(--own);border-top-right-radius:3px}.other .msg-bubble{background:var(--other);border-top-left-radius:3px}.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;color:var(--muted);font-size:12px;min-width:54px}.ticks{font-size:15px;color:#8696a0}.ticks.read{color:var(--blue)}.msg-image{display:block;max-width:min(310px,72vw);max-height:360px;border-radius:10px;object-fit:cover;cursor:pointer}.msg-video{display:block;max-width:min(330px,74vw);max-height:390px;border-radius:10px;background:#000}.msg-file,.msg-location{display:flex;align-items:center;gap:10px;min-width:225px;max-width:310px;background:rgba(255,255,255,.62);border-radius:10px;padding:12px;color:var(--text);text-decoration:none}.file-icon{font-size:26px}.location-box{display:block}.location-title{font-weight:700;margin-bottom:4px}.location-sub{font-size:13px;color:var(--muted)}.typing-indicator{height:24px;padding:4px 14px;font-size:13px;color:var(--muted);background:var(--bg);flex-shrink:0}.composer{display:flex;align-items:flex-end;gap:7px;padding:8px;background:#f0f2f5;flex-shrink:0}.composer-box{flex:1;background:#fff;border-radius:26px;display:flex;align-items:flex-end;padding:5px 6px 5px 13px;gap:1px}.composer textarea{flex:1;border:0;outline:0;resize:none;max-height:110px;padding:10px 4px;font-size:16px;font-family:Inter,Arial,sans-serif;line-height:1.35}.composer-btn{width:37px;height:37px;border:0;background:transparent;color:var(--muted);border-radius:50%;font-size:20px;cursor:pointer}.send-btn{width:46px;height:46px;border:0;border-radius:50%;background:var(--main);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}.preview{display:none;align-items:center;gap:10px;padding:9px 12px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}.preview.active{display:flex}.preview img,.preview video{width:64px;height:64px;object-fit:cover;border-radius:9px;background:#000}.preview-info{flex:1;min-width:0}.preview-title{font-size:14px;font-weight:700}.preview-name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-action{border:0;border-radius:18px;padding:9px 13px;cursor:pointer;font-weight:600}.preview-action.send{background:var(--main);color:#fff}.preview-action.cancel{background:#f1f1f1;color:var(--danger)}.camera-modal,.call-overlay,.incoming-overlay,.lightbox{display:none;position:fixed;inset:0;z-index:1000}.camera-modal.active,.call-overlay.active,.lightbox.active{display:flex}.camera-modal{background:#111;flex-direction:column}.camera-top{height:58px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#000}.camera-body{flex:1;display:flex;align-items:center;justify-content:center;background:#000}.camera-body video,.camera-body canvas{max-width:100%;max-height:100%;object-fit:contain}.camera-actions{min-height:104px;background:#000;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:10px}.capture-btn{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#ddd;cursor:pointer}.capture-btn.recording{background:var(--danger)}.camera-small{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:24px;padding:12px 16px;cursor:pointer;font-weight:600}.mode-pill{background:rgba(255,255,255,.1);border-radius:22px;padding:4px;display:flex;gap:4px}.mode-pill button{border:0;border-radius:18px;padding:8px 11px;background:transparent;color:#fff;cursor:pointer}.mode-pill button.active{background:#fff;color:#111}.call-overlay{background:#111;z-index:1100;flex-direction:column;color:#fff}.call-header{height:72px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));display:flex;align-items:center;padding:14px;gap:12px;z-index:2}.call-avatar{width:42px;height:42px;border-radius:50%;background:#dfe5e7;color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:700}.call-info{flex:1}.call-name{font-weight:700}.call-status{font-size:13px;opacity:.85}.video-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#111}.video-stage.active{background:#000}#remoteVideo{width:100%;height:100%;object-fit:cover;background:#111}#localVideo{position:absolute;right:14px;top:14px;width:118px;height:170px;border-radius:12px;object-fit:cover;background:#222;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 12px rgba(0,0,0,.4)}.call-controls{height:96px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0));display:flex;align-items:center;justify-content:center;gap:20px}.call-btn{width:58px;height:58px;border-radius:50%;border:0;font-size:22px;color:#fff;background:rgba(255,255,255,.18);cursor:pointer}.call-btn.end{background:var(--danger)}.incoming-overlay.active{display:flex}.incoming-overlay{z-index:1050;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.28);padding:18px}.incoming-card{width:min(380px,100%);background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}.incoming-name{font-size:20px;font-weight:700;margin:6px 0}.incoming-type{color:var(--muted);font-size:14px;margin-bottom:16px}.incoming-btns{display:flex;justify-content:center;gap:26px}.lightbox{background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:1300}.lightbox img{max-width:94vw;max-height:94vh;border-radius:6px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.8);color:#fff;padding:10px 14px;border-radius:18px;font-size:14px;z-index:1400;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="header"><div class="avatar" id="avatar">PM</div><div class="title-wrap"><div class="title" id="chatTitle">PrivateMsg</div><div class="status" id="status-text">Bağlanıyor...</div></div><div class="header-actions"><button class="icon-btn" onclick="startCall('audio')" title="Sesli arama">☎️</button><button class="icon-btn" onclick="startCall('video')" title="Görüntülü arama">📹</button><button class="icon-btn" onclick="location.href='/logout'" title="Çıkış">⋮</button></div></div>
<div class="messages-container" id="messages"><div class="day-divider">Bugün</div></div><div class="typing-indicator" id="typingIndicator"></div>
<div class="preview" id="mediaPreview"><img id="mediaPreviewImg" src="" alt="Önizleme"><video id="mediaPreviewVideo" muted playsinline style="display:none"></video><div class="preview-info"><div class="preview-title" id="mediaPreviewTitle">Medya hazır</div><div class="preview-name" id="mediaPreviewName"></div></div><button class="preview-action cancel" onclick="clearSelectedMedia()">İptal</button><button class="preview-action send" onclick="sendSelectedMedia()">Gönder</button></div>
<div class="composer"><div class="composer-box"><textarea id="msg-input" rows="1" maxlength="4000" placeholder="Mesaj"></textarea><button class="composer-btn" onclick="openCameraModal('photo')" title="Fotoğraf çek">📷</button><button class="composer-btn" onclick="openCameraModal('video')" title="Video çek">🎥</button><button class="composer-btn" onclick="sendLocation()" title="Konum gönder">📍</button><button class="composer-btn" onclick="document.getElementById('photoInput').click()" title="Galeriden fotoğraf">🖼️</button><button class="composer-btn" onclick="document.getElementById('fileInput').click()" title="Dosya">📎</button></div><button class="send-btn" onclick="sendMessage()">➤</button></div>
<input type="file" id="photoInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="handlePhotoSelect(this)"><input type="file" id="fileInput" accept="application/pdf,video/mp4,video/webm,video/quicktime" style="display:none" onchange="handleFileUpload(this)">
<div class="camera-modal" id="cameraModal"><div class="camera-top"><button class="camera-small" onclick="closeCameraModal()">Kapat</button><div class="mode-pill"><button id="photoModeBtn" onclick="setCameraMode('photo')">Foto</button><button id="videoModeBtn" onclick="setCameraMode('video')">Video</button></div><button class="camera-small" onclick="flipCamera()">Çevir</button></div><div class="camera-body"><video id="cameraVideo" autoplay playsinline muted></video><canvas id="cameraCanvas" style="display:none"></canvas></div><div class="camera-actions"><button class="camera-small" onclick="closeCameraModal()">İptal</button><button class="capture-btn" id="captureBtn" onclick="captureOrRecord()"></button><button class="camera-small" onclick="sendCapturedMedia()" id="sendCaptureBtn" style="display:none">Gönder</button></div></div>
<div class="incoming-overlay" id="incomingOverlay"><div class="incoming-card"><div>Gelen arama</div><div class="incoming-name" id="incomingName"></div><div class="incoming-type" id="incomingType"></div><div class="incoming-btns"><button class="call-btn end" onclick="rejectCall()">📵</button><button class="call-btn" style="background:var(--light)" onclick="acceptCall()">📞</button></div></div></div>
<div class="call-overlay" id="callOverlay"><div class="call-header"><div class="call-avatar">PM</div><div class="call-info"><div class="call-name" id="callUserName"></div><div class="call-status" id="callStatus">Bağlanıyor...</div></div></div><div class="video-stage" id="videoStage"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div><div class="call-controls"><button class="call-btn" id="muteBtn" onclick="toggleMute()">🎙️</button><button class="call-btn" id="videoBtn" onclick="toggleVideo()">📹</button><button class="call-btn end" onclick="endCall()">📵</button></div></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div><div class="toast" id="toast"></div>
<script>
const ME={{user|tojson}};const socket=io();let typingTimer,isTyping=false,peerConnection=null,localStream=null,callType=null,incomingCallData=null,isMuted=false,isVideoOff=false,otherOnline=false,callActive=false,sentEndSignal=false,selectedMediaFile=null,selectedMediaKind=null,selectedMediaObjectUrl=null,cameraStream=null,cameraFacing='environment',cameraMode='photo',capturedBlob=null,capturedKind=null,mediaRecorder=null,recordedChunks=[],recording=false;
const messagesEl=document.getElementById('messages');
socket.on('connect',()=>{socket.emit('join',{});loadHistory();});socket.on('connect_error',()=>showToast('Bağlantı hatası'));socket.on('disconnect',()=>showToast('Bağlantı koptu'));
async function loadHistory(){try{const res=await fetch('/api/messages');if(!res.ok)return;const msgs=await res.json();messagesEl.innerHTML='';let lastDate='';msgs.forEach(m=>{appendDateDividerIfNeeded(m.date_label,lastDate);if(m.date_label)lastDate=m.date_label;appendMessage(m);});scrollToBottom();markVisibleMessagesRead();}catch(e){console.error(e)}}
function appendDateDividerIfNeeded(d,last){if(!d||d===last)return;const div=document.createElement('div');div.className='day-divider';div.textContent=isTodayLabel(d)?'Bugün':d;messagesEl.appendChild(div)}function isTodayLabel(d){return d===new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})}
socket.on('user_status',data=>{const list=Array.isArray(data.online)?data.online:[];const others=list.filter(u=>u.id!==ME.id);otherOnline=others.length>0;document.getElementById('chatTitle').textContent=otherOnline?others[0].name:'PrivateMsg';document.getElementById('avatar').textContent=otherOnline?initials(others[0].name):'PM';document.getElementById('status-text').textContent=otherOnline?'çevrimiçi':'karşı taraf çevrimdışı'});
socket.on('message',msg=>{appendDateDividerIfNeeded(msg.date_label,'');appendMessage(msg);scrollToBottom();markVisibleMessagesRead();});socket.on('messages_read',data=>{(data.ids||[]).forEach(id=>setMessageRead(id));});socket.on('typing',data=>{document.getElementById('typingIndicator').textContent=data.typing&&data.user?`${data.user.name} yazıyor...`:''});
function appendMessage(msg){if(!msg||!msg.user)return;const own=msg.user.id===ME.id;const wrap=document.createElement('div');wrap.className='msg-wrap '+(own?'own':'other');wrap.dataset.id=msg.id;wrap.dataset.sender=msg.user.id;let body='';const safeUrl=sanitizeMediaUrl(msg.file_url||'');if(msg.type==='image'&&safeUrl){body=`<img class="msg-image" src="${safeUrl}" onclick="openLightbox('${safeUrl}')" loading="lazy" alt="Fotoğraf">`;}else if(msg.type==='video'&&safeUrl){body=`<video class="msg-video" src="${safeUrl}" controls playsinline preload="metadata"></video>`;}else if(msg.type==='location'){const loc=parseLocationText(msg.text||'');const mapUrl=loc?`https://www.google.com/maps?q=${loc.lat},${loc.lng}`:'';body=loc?`<a class="msg-location" href="${mapUrl}" target="_blank" rel="noopener"><span class="file-icon">📍</span><span class="location-box"><span class="location-title">Konum paylaşıldı</span><br><span class="location-sub">Haritada aç · ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</span></span></a>`:`<div>${escapeHtml(msg.text||'Konum')}</div>`;}else if(msg.type==='file'&&safeUrl){body=`<a class="msg-file" href="${safeUrl}" target="_blank" rel="noopener" download><span class="file-icon">📄</span><span>${escapeHtml(msg.file_name||'Dosya')}</span></a>`;}else{body=`<div>${escapeHtml(msg.text||'').replace(/\n/g,'<br>')}</div>`;}wrap.innerHTML=`<div class="msg-name">${own?'':escapeHtml(msg.user.name||'')}</div><div class="msg-bubble">${body}<div class="msg-meta"><span>${escapeHtml(msg.timestamp||'')}</span>${own?`<span class="ticks ${msg.read?'read':''}" data-tick-for="${msg.id}">✓✓</span>`:''}</div></div>`;messagesEl.appendChild(wrap)}
function setMessageRead(id){const t=document.querySelector(`[data-tick-for="${CSS.escape(id)}"]`);if(t)t.classList.add('read')}function markVisibleMessagesRead(){const ids=[...document.querySelectorAll('.msg-wrap.other')].map(el=>el.dataset.id).filter(Boolean);if(ids.length)socket.emit('messages_read',{ids})}messagesEl.addEventListener('scroll',()=>{clearTimeout(window.readTimer);window.readTimer=setTimeout(markVisibleMessagesRead,300)});window.addEventListener('focus',markVisibleMessagesRead);
function sendMessage(){const input=document.getElementById('msg-input');const text=input.value.trim();if(!text)return;socket.emit('message',{text,type:'text'});input.value='';input.style.height='auto';stopTyping()}const msgInput=document.getElementById('msg-input');msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});msgInput.addEventListener('input',()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,110)+'px';if(!isTyping){isTyping=true;socket.emit('typing',{typing:true})}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,2000)});function stopTyping(){if(isTyping){isTyping=false;socket.emit('typing',{typing:false})}}
function handlePhotoSelect(input){const file=input.files[0];if(!file)return;prepareMediaPreview(file,'image')}function prepareMediaPreview(file,kind){if(kind==='image'&&!['image/png','image/jpeg','image/gif','image/webp'].includes(file.type)){showToast('Sadece PNG, JPG, JPEG, GIF veya WEBP');return}if(kind==='video'&&!['video/mp4','video/webm','video/quicktime'].includes(file.type)){showToast('Sadece MP4, WEBM veya MOV video');return}clearSelectedMedia();selectedMediaFile=file;selectedMediaKind=kind;selectedMediaObjectUrl=URL.createObjectURL(file);const img=document.getElementById('mediaPreviewImg'),vid=document.getElementById('mediaPreviewVideo');if(kind==='video'){img.style.display='none';vid.style.display='block';vid.src=selectedMediaObjectUrl}else{vid.style.display='none';img.style.display='block';img.src=selectedMediaObjectUrl}document.getElementById('mediaPreviewTitle').textContent=kind==='video'?'Video hazır':'Fotoğraf hazır';document.getElementById('mediaPreviewName').textContent=file.name||'kamera';document.getElementById('mediaPreview').classList.add('active')}function clearSelectedMedia(){selectedMediaFile=null;selectedMediaKind=null;if(selectedMediaObjectUrl){URL.revokeObjectURL(selectedMediaObjectUrl);selectedMediaObjectUrl=null}document.getElementById('photoInput').value='';document.getElementById('mediaPreview').classList.remove('active');document.getElementById('mediaPreviewVideo').removeAttribute('src');document.getElementById('mediaPreviewImg').removeAttribute('src')}async function sendSelectedMedia(){if(!selectedMediaFile)return;await uploadAndSendMedia(selectedMediaFile,selectedMediaKind);clearSelectedMedia()}
async function uploadAndSendMedia(file,kind){const fd=new FormData();const field=kind==='image'?'photo':'file';fd.append(field,file,file.name||(kind==='video'?'camera.webm':'camera.jpg'));showToast((kind==='video'?'Video':'Fotoğraf')+' yükleniyor...');try{const res=await fetch(kind==='image'?'/upload/photo':'/upload',{method:'POST',body:fd});const data=await res.json();if(res.ok&&data.url){socket.emit('message',{type:data.type==='video'?'video':kind,file_url:data.url,file_name:data.name,text:''});showToast('Gönderildi ✓')}else showToast('Hata: '+(data.error||'Bilinmeyen'))}catch(e){showToast('Yükleme hatası')}}
async function handleFileUpload(input){const file=input.files[0];if(!file)return;const isVideo=['video/mp4','video/webm','video/quicktime'].includes(file.type);if(isVideo){prepareMediaPreview(file,'video');input.value='';return}if(file.type!=='application/pdf'){showToast('Sadece PDF veya video');input.value='';return}const fd=new FormData();fd.append('file',file);showToast('Dosya yükleniyor...');try{const res=await fetch('/upload',{method:'POST',body:fd});const data=await res.json();if(res.ok&&data.url){socket.emit('message',{type:'file',file_url:data.url,file_name:data.name,text:''});showToast('Dosya gönderildi ✓')}else showToast('Hata: '+(data.error||'Bilinmeyen'))}catch(e){showToast('Yükleme hatası')}input.value=''}
async function sendLocation(){if(!navigator.geolocation){showToast('Konum desteklenmiyor');return}showToast('Konum alınıyor...');navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;socket.emit('message',{type:'location',text:`${lat},${lng}`});showToast('Konum gönderildi ✓')},()=>showToast('Konum izni alınamadı'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
async function openCameraModal(mode='photo'){document.getElementById('cameraModal').classList.add('active');setCameraMode(mode);capturedBlob=null;capturedKind=null;await startCamera()}function setCameraMode(mode){cameraMode=mode;document.getElementById('photoModeBtn').classList.toggle('active',mode==='photo');document.getElementById('videoModeBtn').classList.toggle('active',mode==='video');document.getElementById('sendCaptureBtn').style.display='none';document.getElementById('captureBtn').classList.remove('recording');document.getElementById('cameraCanvas').style.display='none';document.getElementById('cameraVideo').style.display='block'}async function startCamera(){try{stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:cameraMode==='video'});document.getElementById('cameraVideo').srcObject=cameraStream}catch(e){showToast('Kamera açılamadı')}}function stopCamera(){if(mediaRecorder&&recording)mediaRecorder.stop();if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}recording=false}function closeCameraModal(){stopCamera();document.getElementById('cameraModal').classList.remove('active');capturedBlob=null;capturedKind=null}async function flipCamera(){cameraFacing=cameraFacing==='user'?'environment':'user';await startCamera()}function captureOrRecord(){cameraMode==='video'?toggleRecording():capturePhoto()}function capturePhoto(){const video=document.getElementById('cameraVideo'),canvas=document.getElementById('cameraCanvas');if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.style.display='block';video.style.display='none';canvas.toBlob(blob=>{capturedBlob=blob;capturedKind='image';document.getElementById('sendCaptureBtn').style.display='inline-block'},'image/jpeg',0.92)}function toggleRecording(){if(!cameraStream)return;if(!recording){recordedChunks=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';mediaRecorder=new MediaRecorder(cameraStream,{mimeType:type});mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{capturedBlob=new Blob(recordedChunks,{type:'video/webm'});capturedKind='video';document.getElementById('sendCaptureBtn').style.display='inline-block';showToast('Video hazır')};mediaRecorder.start();recording=true;document.getElementById('captureBtn').classList.add('recording');showToast('Video kaydı başladı')}else{mediaRecorder.stop();recording=false;document.getElementById('captureBtn').classList.remove('recording')}}async function sendCapturedMedia(){if(!capturedBlob)return;const file=new File([capturedBlob],capturedKind==='video'?`camera-${Date.now()}.webm`:`camera-${Date.now()}.jpg`,{type:capturedBlob.type});await uploadAndSendMedia(file,capturedKind);closeCameraModal()}
const iceConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};async function startCall(type){if(!otherOnline){showToast('Karşı taraf çevrimdışı');return}if(callActive){showToast('Zaten aktif arama var');return}callType=type;callActive=true;sentEndSignal=false;socket.emit('call_request',{type});showCallOverlay(type,'Aranıyor...')}socket.on('call_request',data=>{if(callActive){socket.emit('call_response',{accepted:false,reason:'busy'});return}incomingCallData=data;document.getElementById('incomingName').textContent=data.from?.name||'Karşı taraf';document.getElementById('incomingType').textContent=data.type==='video'?'Görüntülü arama':'Sesli arama';document.getElementById('incomingOverlay').classList.add('active');ringbell()});async function acceptCall(){if(!incomingCallData)return;document.getElementById('incomingOverlay').classList.remove('active');callType=incomingCallData.type;callActive=true;sentEndSignal=false;try{await initLocalStream();showCallOverlay(callType,'Bağlanıyor...');peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);socket.emit('webrtc_offer',{sdp:offer});socket.emit('call_response',{accepted:true})}catch(e){showToast('Mikrofon/kamera izni alınamadı');socket.emit('call_response',{accepted:false});cleanupCall()}}function rejectCall(){document.getElementById('incomingOverlay').classList.remove('active');socket.emit('call_response',{accepted:false});incomingCallData=null}socket.on('call_response',async data=>{if(!data.accepted){cleanupCall();showToast(data.reason==='busy'?'Karşı taraf meşgul':'Arama reddedildi');return}try{await initLocalStream();peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream))}catch(e){showToast('Mikrofon/kamera izni alınamadı');endCall()}});socket.on('webrtc_offer',async data=>{try{if(!peerConnection){await initLocalStream();peerConnection=createPC();localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream))}await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);socket.emit('webrtc_answer',{sdp:answer});document.getElementById('callStatus').textContent='Bağlandı'}catch(e){showToast('Arama kurulamadı');endCall()}});socket.on('webrtc_answer',async data=>{try{if(peerConnection){await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));document.getElementById('callStatus').textContent='Bağlandı'}}catch(e){endCall()}});socket.on('webrtc_ice',async data=>{if(peerConnection&&data.candidate){try{await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))}catch(e){}}});socket.on('call_end',()=>{cleanupCall();showToast('Arama sonlandı')});
function createPC(){const pc=new RTCPeerConnection(iceConfig);pc.onicecandidate=e=>{if(e.candidate)socket.emit('webrtc_ice',{candidate:e.candidate})};pc.ontrack=e=>{document.getElementById('remoteVideo').srcObject=e.streams[0];document.getElementById('callStatus').textContent='Bağlandı'};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))document.getElementById('callStatus').textContent='Bağlantı koptu'};return pc}async function initLocalStream(){if(localStream)return;const c=callType==='video'?{audio:true,video:{facingMode:'user'}}:{audio:true,video:false};localStream=await navigator.mediaDevices.getUserMedia(c);document.getElementById('localVideo').srcObject=localStream;document.getElementById('videoStage').classList.toggle('active',callType==='video')}function showCallOverlay(type,status){document.getElementById('callOverlay').classList.add('active');document.getElementById('callUserName').textContent=document.getElementById('chatTitle').textContent;document.getElementById('callStatus').textContent=status;document.getElementById('videoStage').classList.toggle('active',type==='video');document.getElementById('videoBtn').style.display=type==='video'?'block':'none'}function endCall(){if(!sentEndSignal){sentEndSignal=true;socket.emit('call_end',{})}cleanupCall()}function cleanupCall(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(peerConnection){peerConnection.close();peerConnection=null}document.getElementById('callOverlay').classList.remove('active');document.getElementById('incomingOverlay').classList.remove('active');document.getElementById('remoteVideo').srcObject=null;document.getElementById('localVideo').srcObject=null;document.getElementById('muteBtn').textContent='🎙️';document.getElementById('videoBtn').textContent='📹';isMuted=false;isVideoOff=false;callActive=false;callType=null;incomingCallData=null}function toggleMute(){if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);document.getElementById('muteBtn').textContent=isMuted?'🔇':'🎙️'}function toggleVideo(){if(!localStream)return;isVideoOff=!isVideoOff;localStream.getVideoTracks().forEach(t=>t.enabled=!isVideoOff);document.getElementById('videoBtn').textContent=isVideoOff?'📵':'📹'}
function scrollToBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}function openLightbox(src){const u=sanitizeMediaUrl(src);if(!u)return;document.getElementById('lightboxImg').src=u;document.getElementById('lightbox').classList.add('active')}function closeLightbox(){document.getElementById('lightbox').classList.remove('active')}function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function sanitizeMediaUrl(u){u=String(u||'');return u.startsWith('/media/')?u.replace(/"/g,'%22').replace(/'/g,'%27'):''}function initials(n){return String(n||'PM').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function ringbell(){try{const ctx=new AudioContext(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(520,ctx.currentTime);o.frequency.setValueAtTime(440,ctx.currentTime+.15);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);o.start();o.stop(ctx.currentTime+.5)}catch(e){}}function parseLocationText(s){const m=String(s||'').match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(!m)return null;const lat=parseFloat(m[1]),lng=parseFloat(m[2]);if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return null;return{lat,lng}}
