<script>
const ME={{user|tojson}},socket=io();let selectedMediaFile=null,selectedMediaKind=null,selectedMediaUrl=null,cameraStream=null,cameraFacing='environment',cameraMode='photo',capturedBlob=null,capturedKind=null,mediaRecorder=null,recordedChunks=[],recording=false,typingTimer,isTyping=false,lastUsers=[],otherOnline=false,peerConnection=null,localStream=null,callType=null,incomingCallData=null,callActive=false,sentEndSignal=false,isMuted=false,isVideoOff=false;
socket.on('connect',()=>{socket.emit('join',{});loadHistory();loadStatus()});socket.on('connect_error',()=>show('Bağlantı hatası'));socket.on('disconnect',()=>show('Bağlantı koptu'));
async function loadHistory(){try{let r=await fetch('/api/messages');if(!r.ok)return;let a=await r.json();messages.innerHTML='';let last='';a.forEach(m=>{dateDiv(m.date_label,last);if(m.date_label)last=m.date_label;appendMessage(m)});bottom();markRead();searchMessages()}catch(e){console.error(e)}}
async function loadStatus(){try{let r=await fetch('/api/status');if(r.ok){let d=await r.json();lastUsers=d.users||[];updateStatus(d)}}catch(e){}}
function dateDiv(d,last){if(!d||d===last)return;let x=document.createElement('div');x.className='day';x.textContent=d===new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})?'Bugün':d;messages.appendChild(x)}
socket.on('user_status',updateStatus);function updateStatus(d){let list=Array.isArray(d.online)?d.online:[],others=list.filter(u=>u.id!==ME.id);if(d.users)lastUsers=d.users;otherOnline=others.length>0;let other=otherOnline?others[0]:(lastUsers.find(u=>u.id!==ME.id)||null);chatTitle.textContent=other?other.name:'PrivateMsg';avatar.textContent=other?initials(other.name):'PM';statusText.textContent=otherOnline?'çevrimiçi':(other&&other.last_seen?`son görülme ${other.last_seen}`:'karşı taraf çevrimdışı')}
socket.on('message',m=>{dateDiv(m.date_label,'');appendMessage(m);bottom();markRead();searchMessages()});socket.on('message_deleted',d=>removeMessage(d.id));socket.on('messages_read',d=>(d.ids||[]).forEach(setRead));socket.on('typing',d=>typingIndicator.textContent=d.typing&&d.user?`${d.user.name} yazıyor...`:'' );
function appendMessage(m){if(!m||!m.user)return;let own=m.user.id===ME.id,w=document.createElement('div');w.className='mw '+(own?'own':'other');w.dataset.id=m.id;w.dataset.sender=m.user.id;w.dataset.search=((m.text||'')+' '+(m.file_name||'')+' '+(m.type||'')).toLowerCase();let b='',u=safe(m.file_url||'');if(m.type==='image'&&u)b=`<img class="img" src="${u}" onclick="openLightbox('${u}')" loading="lazy">`;else if(m.type==='video'&&u)b=`<video class="vid" src="${u}" controls playsinline preload="metadata"></video>`;else if(m.type==='location'){let l=parseLoc(m.text||'');b=l?`<a class="loc" href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank" rel="noopener"><span class="fi">📍</span><span><div class="lt">Konum paylaşıldı</div><div class="ls">Haritada aç · ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}</div></span></a>`:`<div class="txt">${esc(m.text||'Konum')}</div>`}else if(m.type==='file'&&u)b=`<a class="file" href="${u}" target="_blank" rel="noopener" download><span class="fi">📄</span><span>${esc(m.file_name||'Dosya')}</span></a>`;else b=`<div class="txt" data-raw="${esc(m.text||'')}">${esc(m.text||'').replace(/\n/g,'<br>')}</div>`;w.innerHTML=`<div class="sender">${own?'':esc(m.user.name||'')}</div><div class="bub" ontouchstart="this.classList.toggle('show')">${own?`<button class="del" onclick="deleteMessage('${m.id}',event)">🗑</button>`:''}${b}<div class="meta"><span>${esc(m.timestamp||'')}</span>${own?`<span class="ticks ${m.read?'read':''}" data-tick-for="${m.id}">✓✓</span>`:''}</div></div>`;messages.appendChild(w)}
async function deleteMessage(id,e){e&&e.stopPropagation();if(!confirm('Bu mesaj silinsin mi?'))return;try{let r=await fetch('/api/messages/'+encodeURIComponent(id),{method:'DELETE'});if(r.ok){removeMessage(id);show('Mesaj silindi')}else{let d=await r.json().catch(()=>({}));show(d.error||'Mesaj silinemedi')}}catch(err){show('Silme hatası')}}function removeMessage(id){let el=document.querySelector(`.mw[data-id="${CSS.escape(id)}"]`);if(el)el.remove()}
function toggleSearch(){searchBar.classList.add('on');searchInput.focus()}function clearSearch(){searchInput.value='';searchBar.classList.remove('on');searchMessages()}function searchMessages(){let q=(searchInput.value||'').trim().toLowerCase();document.querySelectorAll('.mw').forEach(el=>{el.classList.remove('hit','hide');let txt=el.querySelector('.txt'),raw=txt?txt.dataset.raw:null;if(txt&&raw!=null)txt.innerHTML=raw.replace(/\n/g,'<br>');if(!q)return;if(!el.dataset.search.includes(q)){el.classList.add('hide');return}el.classList.add('hit');if(txt&&raw!=null){let re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');txt.innerHTML=raw.replace(re,'<mark>$1</mark>').replace(/\n/g,'<br>')}})}
function setRead(id){let t=document.querySelector(`[data-tick-for="${CSS.escape(id)}"]`);if(t)t.classList.add('read')}function markRead(){let ids=[...document.querySelectorAll('.mw.other')].map(x=>x.dataset.id).filter(Boolean);if(ids.length)socket.emit('messages_read',{ids})}messages.addEventListener('scroll',()=>{clearTimeout(window.readTimer);window.readTimer=setTimeout(markRead,300)});window.addEventListener('focus',markRead);
function sendMessage(){let t=msgInput.value.trim();if(!t)return;socket.emit('message',{text:t,type:'text'});msgInput.value='';msgInput.style.height='auto';stopTyping()}msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});msgInput.addEventListener('input',()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,110)+'px';if(!isTyping){isTyping=true;socket.emit('typing',{typing:true})}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,2000)});function stopTyping(){if(isTyping){isTyping=false;socket.emit('typing',{typing:false})}}
function handlePhotoSelect(i){let f=i.files[0];if(f)prep(f,'image')}function prep(f,k){if(k==='image'&&!['image/png','image/jpeg','image/gif','image/webp'].includes(f.type)){show('Sadece fotoğraf');return}if(k==='video'&&!['video/mp4','video/webm','video/quicktime'].includes(f.type)){show('Sadece video');return}clearSelectedMedia();selectedMediaFile=f;selectedMediaKind=k;selectedMediaUrl=URL.createObjectURL(f);if(k==='video'){previewImg.style.display='none';previewVideo.style.display='block';previewVideo.src=selectedMediaUrl}else{previewVideo.style.display='none';previewImg.style.display='block';previewImg.src=selectedMediaUrl}previewTitle.textContent=k==='video'?'Video hazır':'Fotoğraf hazır';previewName.textContent=f.name||'kamera';mediaPreview.classList.add('on')}function clearSelectedMedia(){selectedMediaFile=null;selectedMediaKind=null;if(selectedMediaUrl)URL.revokeObjectURL(selectedMediaUrl);selectedMediaUrl=null;photoInput.value='';mediaPreview.classList.remove('on');previewVideo.removeAttribute('src');previewImg.removeAttribute('src')}async function sendSelectedMedia(){if(selectedMediaFile){await uploadMedia(selectedMediaFile,selectedMediaKind);clearSelectedMedia()}}
async function uploadMedia(f,k){let fd=new FormData(),field=k==='image'?'photo':'file';fd.append(field,f,f.name||(k==='video'?'camera.webm':'camera.jpg'));show((k==='video'?'Video':'Fotoğraf')+' yükleniyor...');try{let r=await fetch(k==='image'?'/upload/photo':'/upload',{method:'POST',body:fd}),d=await r.json();if(r.ok&&d.url){socket.emit('message',{type:d.type==='video'?'video':k,file_url:d.url,file_name:d.name,text:''});show('Gönderildi ✓')}else show('Hata: '+(d.error||'Bilinmeyen'))}catch(e){show('Yükleme hatası')}}async function handleFileUpload(i){let f=i.files[0];if(!f)return;if(['video/mp4','video/webm','video/quicktime'].includes(f.type)){prep(f,'video');i.value='';return}if(f.type!=='application/pdf'){show('Sadece PDF veya video');i.value='';return}let fd=new FormData();fd.append('file',f);try{let r=await fetch('/upload',{method:'POST',body:fd}),d=await r.json();if(r.ok&&d.url){socket.emit('message',{type:'file',file_url:d.url,file_name:d.name,text:''});show('Dosya gönderildi ✓')}else show(d.error||'Hata')}catch(e){show('Yükleme hatası')}i.value=''}
function sendLocation(){if(!navigator.geolocation){show('Konum desteklenmiyor');return}show('Konum alınıyor...');navigator.geolocation.getCurrentPosition(p=>{socket.emit('message',{type:'location',text:`${p.coords.latitude},${p.coords.longitude}`});show('Konum gönderildi ✓')},()=>show('Konum izni alınamadı'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
async function openCameraModal(m='photo'){cameraModal.classList.add('on');setCameraMode(m);capturedBlob=null;capturedKind=null;await startCamera()}function setCameraMode(m){cameraMode=m;photoModeBtn.classList.toggle('on',m==='photo');videoModeBtn.classList.toggle('on',m==='video');sendCaptureBtn.style.display='none';captureBtn.classList.remove('rec');cameraCanvas.style.display='none';cameraVideo.style.display='block'}async function startCamera(){try{stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing},audio:cameraMode==='video'});cameraVideo.srcObject=cameraStream}catch(e){show('Kamera açılamadı')}}function stopCamera(){if(mediaRecorder&&recording)mediaRecorder.stop();if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}recording=false}function closeCameraModal(){stopCamera();cameraModal.classList.remove('on');capturedBlob=null;capturedKind=null}async function flipCamera(){cameraFacing=cameraFacing==='user'?'environment':'user';await startCamera()}function captureOrRecord(){cameraMode==='video'?recVideo():photo()}function photo(){if(!cameraVideo.videoWidth)return;cameraCanvas.width=cameraVideo.videoWidth;cameraCanvas.height=cameraVideo.videoHeight;cameraCanvas.getContext('2d').drawImage(cameraVideo,0,0);cameraCanvas.style.display='block';cameraVideo.style.display='none';cameraCanvas.toBlob(b=>{capturedBlob=b;capturedKind='image';sendCaptureBtn.style.display='inline-block'},'image/jpeg',.92)}function recVideo(){if(!cameraStream)return;if(!recording){recordedChunks=[];let type=MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';mediaRecorder=new MediaRecorder(cameraStream,{mimeType:type});mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{capturedBlob=new Blob(recordedChunks,{type:'video/webm'});capturedKind='video';sendCaptureBtn.style.display='inline-block';show('Video hazır')};mediaRecor
