<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PrivateMsg</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;
  --surface:#13132a;
  --surface2:#1a1a35;
  --border:#2a2a4a;
  --accent:#6c63ff;
  --accent-glow:rgba(108,99,255,0.3);
  --accent2:#ff6b9d;
  --accent2-glow:rgba(255,107,157,0.25);
  --cyan:#00d4ff;
  --green:#00e5a0;
  --text:#f0eeff;
  --muted:#7b78a8;
  --error:#ff4d6d;
  --sent-bg:linear-gradient(135deg,#6c63ff,#8b5cf6);
  --recv-bg:#1e1e3f;
  --header-h:62px;
  --input-h:72px;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;
  height:100dvh;
}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;
  padding:0 16px;
  height:var(--header-h);
  background:rgba(19,19,42,0.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;z-index:10;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;
  flex-shrink:0;
  box-shadow:0 0 12px var(--accent-glow);
}
.header-info{flex:1;padding:0 10px;min-width:0}
.header-name{
  font-size:14px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-status{
  font-size:11px;font-weight:500;margin-top:1px;
  display:flex;align-items:center;gap:5px;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted);flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.status-dot.online{
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 6px var(--green)}50%{box-shadow:0 0 14px var(--green)}}
#statusText{transition:color .3s}
.header-btns{display:flex;gap:6px;flex-shrink:0}
.hbtn{
  width:36px;height:36px;border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.hbtn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-glow)}
.hbtn.red:hover{border-color:var(--error);background:rgba(255,77,109,0.1);color:var(--error)}

/* ── MESSAGES ── */
.msgs-wrap{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 12px 8px;
  display:flex;flex-direction:column;gap:2px;
  -webkit-overflow-scrolling:touch;
}
.msgs-wrap::-webkit-scrollbar{width:3px}
.msgs-wrap::-webkit-scrollbar-track{background:transparent}
.msgs-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.day-sep{
  text-align:center;margin:14px 0 10px;
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.day-sep::before,.day-sep::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border));
}
.day-sep::after{background:linear-gradient(270deg,transparent,var(--border))}

.msg-group{
  display:flex;flex-direction:column;
  max-width:78%;
  animation:msgIn .2s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-group.sent{align-self:flex-end;align-items:flex-end}
.msg-group.recv{align-self:flex-start;align-items:flex-start}

.msg-name{
  font-size:10px;font-weight:600;letter-spacing:.5px;
  margin-bottom:4px;padding:0 4px;
}
.msg-group.sent .msg-name{color:var(--accent)}
.msg-group.recv .msg-name{color:var(--accent2)}

.bubble{
  padding:10px 14px;
  font-size:14px;line-height:1.55;
  word-break:break-word;
  max-width:100%;
  position:relative;
}
.msg-group.sent .bubble{
  background:var(--sent-bg);
  border-radius:18px 18px 4px 18px;
  color:#fff;
  box-shadow:0 4px 16px rgba(108,99,255,0.35);
}
.msg-group.recv .bubble{
  background:var(--recv-bg);
  border:1px solid var(--border);
  border-radius:18px 18px 18px 4px;
  color:var(--text);
}

.msg-meta{
  display:flex;align-items:center;gap:5px;
  padding:0 4px;margin-top:4px;
}
.msg-time{font-size:10px;color:var(--muted);font-weight:500}
.read-tick{font-size:11px;line-height:1}
.read-tick.sent-unread{color:var(--muted)}
.read-tick.sent-read{color:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}

/* Image messages */
.msg-img{
  max-width:240px;max-height:280px;
  border-radius:14px;cursor:pointer;
  display:block;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  transition:opacity .2s,transform .1s;
}
.msg-img:hover{opacity:.9;transform:scale(1.01)}
.msg-group.sent .msg-img{border-radius:14px 14px 4px 14px}
.msg-group.recv .msg-img{border-radius:14px 14px 14px 4px}

/* File messages */
.msg-file{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface2);
  text-decoration:none;color:var(--text);
  font-size:12px;font-weight:500;
  transition:border-color .2s;
  max-width:240px;
}
.msg-file:hover{border-color:var(--accent)}
.file-ico{font-size:28px;flex-shrink:0}

/* ── TYPING ── */
.typing-bar{
  min-height:28px;padding:0 16px;
  font-size:11px;font-weight:500;
  color:var(--muted);
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.dots{display:flex;gap:3px}
.dots span{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent2);opacity:0;
  animation:dotBlink 1.2s infinite;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBlink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* ── INPUT ── */
.input-area{
  padding:10px 12px;
  background:rgba(19,19,42,0.95);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-end;gap:8px;
  flex-shrink:0;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
.input-box{
  flex:1;
  display:flex;align-items:flex-end;
  background:var(--surface2);
  border:1.5px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
}
.input-box:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
#msgInput{
  flex:1;background:transparent;border:none;
  color:var(--text);font-family:'Inter',sans-serif;
  font-size:15px;padding:12px 4px 12px 16px;
  resize:none;max-height:120px;outline:none;line-height:1.45;
}
#msgInput::placeholder{color:var(--muted)}
.attach-btn{
  padding:10px 12px;background:transparent;border:none;
  color:var(--muted);cursor:pointer;font-size:20px;
  transition:color .2s;flex-shrink:0;
}
.attach-btn:hover{color:var(--accent2)}
.send-btn{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  border:none;color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  box-shadow:0 4px 16px var(--accent-glow);
  transition:transform .15s,box-shadow .15s;
}
.send-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px var(--accent-glow)}
.send-btn:active{transform:scale(.95)}

/* ── CALL OVERLAY ── */
.call-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(13,13,26,0.97);
  backdrop-filter:blur(20px);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
.call-overlay.show{display:flex}
.call-type-label{
  font-size:11px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);
}
.call-name{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,var(--text),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.call-status{font-size:12px;color:var(--muted);font-weight:500}
.video-box{
  position:relative;width:min(90vw,560px);display:none;
}
.video-box.show{display:block}
#remoteVideo{width:100%;border-radius:16px;background:#000;border:1px solid var(--border)}
#localVideo{
  position:absolute;bottom:12px;right:12px;
  width:100px;border-radius:10px;
  border:2px solid var(--accent);background:#000;
}
.call-btns{display:flex;gap:14px}
.cbtn{
  width:54px;height:54px;border-radius:50%;border:none;
  font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.cbtn:hover{transform:scale(1.1)}
.cbtn:active{transform:scale(.95)}
.cbtn.end{background:var(--error);box-shadow:0 4px 16px rgba(255,77,109,0.4)}
.cbtn.ctrl{background:var(--surface2);border:1px solid var(--border)}
.cbtn.accept{background:var(--green);box-shadow:0 4px 16px rgba(0,229,160,0.4)}

/* ── INCOMING ── */
.incoming{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  z-index:99;
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--accent2);
  border-radius:20px;
  padding:20px 28px;
  display:none;flex-direction:column;align-items:center;gap:12px;
  min-width:260px;
  box-shadow:0 16px 48px rgba(0,0,0,0.6);
  animation:slideUp .3s ease;
}
.incoming.show{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.inc-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.inc-name{font-size:20px;font-weight:800}
.inc-type{font-size:12px;color:var(--accent2);font-weight:500}
.inc-btns{display:flex;gap:20px;margin-top:4px}

/* ── LIGHTBOX ── */
.lightbox{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.93);
  align-items:center;justify-content:center;
  cursor:zoom-out;
}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;border-radius:8px}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  z-index:300;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:24px;padding:10px 20px;
  font-size:12px;font-weight:600;
  white-space:nowrap;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── OFFLINE BANNER ── */
.offline-banner{
  background:linear-gradient(135deg,rgba(255,107,157,0.15),rgba(255,77,109,0.1));
  border-bottom:1px solid rgba(255,107,157,0.3);
  padding:8px 16px;
  font-size:11px;font-weight:600;color:var(--accent2);
  text-align:center;letter-spacing:.5px;
  display:none;flex-shrink:0;
}
.offline-banner.show{display:block}

/* Mobile fixes */
@media(max-width:480px){
  .msg-group{max-width:88%}
  .msg-img{max-width:200px}
  .hbtn:last-child span{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="avatar" id="otherAvatar">?</div>
  <div class="header-info">
    <div class="header-name" id="otherName">Bağlanıyor...</div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText" style="color:var(--muted)">...</span>
    </div>
  </div>
  <div class="header-btns">
    <button class="hbtn" title="Sesli Arama" onclick="startCall('audio')">🎙️</button>
    <button class="hbtn" title="Görüntülü Arama" onclick="startCall('video')">📹</button>
    <button class="hbtn red" title="Çıkış" onclick="location.href='/logout'">🚪</button>
  </div>
</div>

<!-- OFFLINE BANNER -->
<div class="offline-banner" id="offlineBanner">
  📵 Karşı taraf çevrimdışı — Mesajlar iletildiğinde gösterilecek
</div>

<!-- MESSAGES -->
<div class="msgs-wrap" id="msgs"></div>

<!-- TYPING -->
<div class="typing-bar" id="typingBar"></div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-box">
    <textarea id="msgInput" placeholder="Mesaj yaz..." rows="1" maxlength="4000"></textarea>
    <button class="attach-btn" onclick="document.getElementById('fileInp').click()">📎</button>
  </div>
  <button class="send-btn" onclick="sendMsg()">➤</button>
</div>

<input type="file" id="fileInp" accept="image/*,.pdf,.mp4" style="display:none" onchange="handleFile(this)">

<!-- INCOMING CALL -->
<div class="incoming" id="incoming">
  <div class="inc-label">Gelen Arama</div>
  <div class="inc-name" id="incName"></div>
  <div class="inc-type" id="incType"></div>
  <div class="inc-btns">
    <button class="cbtn accept" onclick="acceptCall()">📞</button>
    <button class="cbtn end" onclick="rejectCall()">📵</button>
  </div>
</div>

<!-- CALL OVERLAY -->
<div class="call-overlay" id="callOverlay">
  <div class="call-type-label" id="callTypeLabel"></div>
  <div class="call-name" id="callName"></div>
  <div class="call-status" id="callStatusTxt">Bağlanıyor...</div>
  <div class="video-box" id="videoBox">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="call-btns">
    <button class="cbtn ctrl" id="muteBtn" onclick="toggleMute()">🎙️</button>
    <button class="cbtn ctrl" id="vidBtn" onclick="toggleVid()">📹</button>
    <button class="cbtn end" onclick="endCall()">📵</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lb" onclick="closeLb()">
  <img id="lbImg" src="">
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const ME = {{ user | tojson }};
const socket = io();

let typingTimer, isTyping=false;
let pc=null, localStream=null, callType=null, incData=null;
let muted=false, vidOff=false;
let otherOnline=false;

// ─── SOCKET ───────────────────────────────────────────────────────────────

socket.on('connect', () => {
  socket.emit('join', {});
  loadHistory();
});

socket.on('user_status', d => {
  const others = d.online.filter(u => u.id !== ME.id);
  otherOnline = others.length > 0;
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  const banner = document.getElementById('offlineBanner');
  const otherName = document.getElementById('otherName');
  const avatar = document.getElementById('otherAvatar');

  if (others.length > 0) {
    const o = others[0];
    otherName.textContent = o.name;
    avatar.textContent = o.name.charAt(0).toUpperCase();
    dot.classList.add('online');
    txt.style.color = 'var(--green)';
    txt.textContent = 'Çevrimiçi';
    banner.classList.remove('show');
  } else {
    dot.classList.remove('online');
    txt.style.color = 'var(--muted)';
    txt.textContent = 'Çevrimdışı';
    banner.classList.add('show');
  }
});

socket.on('message', msg => {
  appendMsg(msg);
  scrollDown();
  // Karşı taraftan gelen mesajı okundu işaretle
  if (msg.user.id !== ME.id) {
    socket.emit('mark_read', {});
  }
});

socket.on('messages_read', d => {
  // Gönderdiğim mesajlara çift tik ekle
  d.ids.forEach(id => markMsgRead(id));
});

socket.on('typing', d => {
  const bar = document.getElementById('typingBar');
  if (d.typing) {
    bar.innerHTML = `<div class="dots"><span></span><span></span><span></span></div>${escHtml(d.user.name)} yazıyor...`;
  } else {
    bar.innerHTML = '';
  }
});

// ─── HISTORY ──────────────────────────────────────────────────────────────

async function loadHistory() {
  try {
    const res = await fetch('/api/messages');
    const data = await res.json();
    if (!data.messages || data.messages.length === 0) return;

    const container = document.getElementById('msgs');
    container.innerHTML = '';
    let lastDate = '';

    data.messages.forEach(msg => {
      if (msg.date_label !== lastDate) {
        lastDate = msg.date_label;
        addDaySep(msg.date_label);
      }
      appendMsg(msg, true);
    });

    // Geçmişte okundu olan mesajları işaretle
    data.messages.forEach(msg => {
      if (msg.user.id === ME.id && msg.read) markMsgRead(msg.id);
    });

    scrollDown();
  } catch(e) { console.error('History error', e); }
}

// ─── MESSAGES ─────────────────────────────────────────────────────────────

function addDaySep(label) {
  const d = document.createElement('div');
  d.className = 'day-sep';
  d.textContent = label;
  document.getElementById('msgs').appendChild(d);
}

function appendMsg(msg, fromHistory=false) {
  const isMe = msg.user.id === ME.id;
  const wrap = document.createElement('div');
  wrap.className = 'msg-group ' + (isMe ? 'sent' : 'recv');
  wrap.dataset.id = msg.id;

  let content = '';
  if (msg.type === 'image') {
    content = `<img class="msg-img" src="${msg.file_url}" onclick="openLb('${msg.file_url}')" loading="lazy">`;
  } else if (msg.type === 'file') {
    content = `<a class="msg-file" href="${msg.file_url}" target="_blank">
      <span class="file-ico">📄</span>
      <span>${escHtml(msg.file_name||'Dosya')}</span>
    </a>`;
  } else {
    content = `<div class="bubble">${escHtml(msg.text).replace(/\n/g,'<br>')}</div>`;
  }

  const tick = isMe
    ? `<span class="read-tick sent-unread" id="tick-${msg.id}">✓</span>`
    : '';

  wrap.innerHTML = `
    <div class="msg-name">${escHtml(msg.user.name)}</div>
    ${content}
    <div class="msg-meta">
      <span class="msg-time">${msg.timestamp}</span>
      ${tick}
    </div>
  `;

  document.getElementById('msgs').appendChild(wrap);
}

function markMsgRead(id) {
  const el = document.getElementById('tick-' + id);
  if (el) {
    el.textContent = '✓✓';
    el.className = 'read-tick sent-read';
  }
}

function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  socket.emit('message', { text, type: 'text' });
  inp.value = '';
  inp.style.height = 'auto';
  stopTyping();
}

// ─── INPUT ────────────────────────────────────────────────────────────────

const inp = document.getElementById('msgInput');

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  if (!isTyping) { isTyping=true; socket.emit('typing',{typing:true}); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2000);
});

function stopTyping() {
  if (isTyping) { isTyping=false; socket.emit('typing',{typing:false}); }
}

// ─── FILE UPLOAD ──────────────────────────────────────────────────────────

async function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  showToast('⏳ Yükleniyor...');
  try {
    const res = await fetch('/upload', {method:'POST', body:fd});
    const data = await res.json();
    if (data.url) {
      socket.emit('message', {
        type: file.type.startsWith('image/') ? 'image' : 'file',
        file_url: data.url, file_name: data.name, text: ''
      });
      showToast('✓ Gönderildi');
    } else { showToast('Hata: ' + (data.error||'?')); }
  } catch { showToast('Yükleme başarısız'); }
  input.value = '';
}

// ─── WEBRTC ───────────────────────────────────────────────────────────────

const ICE = { iceServers: [{urls:'stun:stun.l.google.com:19302'}] };

async function startCall(type) {
  if (!otherOnline) { showToast('📵 Karşı taraf çevrimdışı'); return; }
  callType = type;
  socket.emit('call_request', {type, from:ME});
  showCallUI(type, 'Aranıyor...');
}

socket.on('call_request', d => {
  incData = d;
  document.getElementById('incName').textContent = d.from.name;
  document.getElementById('incType').textContent = d.type==='video'?'📹 Görüntülü':'🎙️ Sesli';
  document.getElementById('incoming').classList.add('show');
  ring();
});

async function acceptCall() {
  document.getElementById('incoming').classList.remove('show');
  callType = incData.type;
  await getStream();
  showCallUI(callType, 'Bağlandı ✓');
  pc = mkPC();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('webrtc_offer', {sdp:offer});
  socket.emit('call_response', {accepted:true});
}

function rejectCall() {
  document.getElementById('incoming').classList.remove('show');
  socket.emit('call_response', {accepted:false});
  incData = null;
}

socket.on('call_response', async d => {
  if (!d.accepted) { endCall(); showToast('Arama reddedildi'); return; }
  await getStream();
  pc = mkPC();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
});

socket.on('webrtc_offer', async d => {
  if (!pc) { await getStream(); pc = mkPC(); localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); }
  await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  socket.emit('webrtc_answer', {sdp:ans});
  document.getElementById('callStatusTxt').textContent = 'Bağlandı ✓';
});

socket.on('webrtc_answer', async d => {
  if (pc) { await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
    document.getElementById('callStatusTxt').textContent = 'Bağlandı ✓'; }
});

socket.on('webrtc_ice', async d => {
  if (pc && d.candidate) try { await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); } catch{}
});

socket.on('call_end', () => { endCall(); showToast('📵 Arama bitti'); });

function mkPC() {
  const p = new RTCPeerConnection(ICE);
  p.onicecandidate = e => { if(e.candidate) socket.emit('webrtc_ice',{candidate:e.candidate}); };
  p.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
    document.getElementById('callStatusTxt').textContent = 'Bağlandı ✓';
  };
  return p;
}

async function getStream() {
  const c = callType==='video' ? {audio:true,video:{facingMode:'user'}} : {audio:true,video:false};
  localStream = await navigator.mediaDevices.getUserMedia(c);
  document.getElementById('localVideo').srcObject = localStream;
}

function showCallUI(type, status) {
  document.getElementById('callTypeLabel').textContent = type==='video'?'📹 Görüntülü Arama':'🎙️ Sesli Arama';
  document.getElementById('callName').textContent = document.getElementById('otherName').textContent;
  document.getElementById('callStatusTxt').textContent = status;
  if (type==='video') document.getElementById('videoBox').classList.add('show');
  document.getElementById('callOverlay').classList.add('show');
}

function endCall() {
  socket.emit('call_end', {});
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if (pc) { pc.close(); pc=null; }
  document.getElementById('callOverlay').classList.remove('show');
  document.getElementById('videoBox').classList.remove('show');
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('incoming').classList.remove('show');
  muted=false; vidOff=false;
}

function toggleMute() {
  if (!localStream) return;
  muted=!muted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
  document.getElementById('muteBtn').textContent = muted?'🔇':'🎙️';
}

function toggleVid() {
  if (!localStream) return;
  vidOff=!vidOff;
  localStream.getVideoTracks().forEach(t=>t.enabled=!vidOff);
  document.getElementById('vidBtn').textContent = vidOff?'🚫':'📹';
}

// ─── UTILS ────────────────────────────────────────────────────────────────

function scrollDown() {
  const el = document.getElementById('msgs');
  el.scrollTop = el.scrollHeight;
}

function openLb(src) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lb').classList.add('show');
}
function closeLb() { document.getElementById('lb').classList.remove('show'); }

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

function ring() {
  try {
    const ctx = new AudioContext();
    [0,0.35,0.7].forEach(delay => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 660;
      g.gain.setValueAtTime(0, ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(0.3, ctx.currentTime+delay+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.3);
      o.start(ctx.currentTime+delay);
      o.stop(ctx.currentTime+delay+0.3);
    });
  } catch {}
}

// Mark read when tab becomes visible
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) socket.emit('mark_read', {});
});
</script>
